name: ci
on: [push, pull_request]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv sync --all-groups --locked
      - run: uv run ruff check .
      # No path argument: the `files` setting in pyproject decides what is
      # checked, so adding a module never silently escapes the gate.
      - run: uv run pytest -q
